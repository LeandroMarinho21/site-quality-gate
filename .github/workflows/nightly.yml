name: nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      CROSS_BROWSER: "1"
      BASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Start app
        run: docker compose up -d --build
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -sf "$BASE_URL/health"; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Jornadas em Firefox, WebKit e mobile, duas vezes cada
        id: tests
        run: npx playwright test --project=firefox --project=webkit --project=mobile --repeat-each=2
      - name: Summary
        if: always()
        env:
          SUMMARY_KIND: nightly
          CI_OUTCOME: ${{ steps.tests.outcome }}
        run: node scripts/write-summary.js
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('playwright-report/**') != ''
        with:
          name: playwright-report-nightly
          path: playwright-report
          retention-days: 7
      - name: Stop app
        if: always()
        run: docker compose down
