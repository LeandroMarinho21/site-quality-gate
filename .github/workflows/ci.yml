name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Start app
        run: docker compose up -d --build
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Regression and smoke
        run: npx playwright test --grep-invert @demo
        env:
          BASE_URL: http://127.0.0.1:8080
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Stop app
        if: always()
        run: docker compose down
