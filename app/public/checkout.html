<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout · Nimbus Shop</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="bar">
        <a class="brand" href="/" data-testid="brand">Nimbus Shop</a>
        <form class="search" action="/catalog.html" data-testid="search-form">
          <input name="q" type="search" placeholder="Buscar: lanterna, bota, mochila" data-testid="search-input" />
          <button type="submit">Buscar</button>
        </form>
        <a class="bag" href="/cart.html" data-testid="nav-cart">Sacola <span class="count" data-testid="cart-count">0</span></a>
      </div>
      <nav class="nav">
        <a href="/" data-testid="nav-home">Home</a>
        <a href="/catalog.html" data-testid="nav-catalog">Catálogo</a>
        <a href="/about.html" data-testid="nav-about">Sobre</a>
        <a href="/contact.html" data-testid="nav-contact">Contato</a>
        <a href="/status" data-testid="nav-status">Status</a>
      </nav>
    </header>
    <main class="wrap">
      <h1 data-testid="checkout-title">Checkout</h1>
      <p class="lede">Exemplo: Mariana Alves, e-mail pessoal, CEP da Av. Paulista. Pagamento combinado na retirada — sem captura de cartão.</p>
      <form class="stack" data-testid="checkout-form">
        <label>Nome completo <input name="name" required data-testid="checkout-name" placeholder="Mariana Alves" /></label>
        <label>E-mail <input name="email" type="email" required data-testid="checkout-email" placeholder="mariana.alves@example.com" /></label>
        <label>CEP <input name="cep" required data-testid="checkout-cep" placeholder="01310-100" /></label>
        <button type="submit">Confirmar pedido</button>
      </form>
      <p class="flash" hidden data-testid="checkout-result"></p>
      <p class="error" hidden data-testid="checkout-error"></p>
    </main>
    <footer class="site-footer">
      <p>Nimbus Shop · loja de demonstração para quality gate · Release 1.0</p>
    </footer>
    <script src="/app.js" defer></script>
  </body>
</html>
