<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dispatch · Nimbus Gate</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="bar">
        <a class="brand" href="/" data-testid="brand">Nimbus <span>Gate</span></a>
        <form class="search" action="/catalog.html" data-testid="search-form">
          <input name="q" type="search" placeholder="Buscar suite: smoke, canary, error_rate" data-testid="search-input" />
          <button type="submit">Buscar</button>
        </form>
        <a class="bag" href="/cart.html" data-testid="nav-cart">Fila <span class="count" data-testid="cart-count">0</span></a>
      </div>
      <nav class="nav">
        <a href="/" data-testid="nav-home">Console</a>
        <a href="/catalog.html" data-testid="nav-catalog">Suites</a>
        <a href="/about.html" data-testid="nav-about">Sobre</a>
        <a href="/contact.html" data-testid="nav-contact">Flake</a>
        <a href="/status" data-testid="nav-status">Status</a>
      </nav>
    </header>
    <main class="wrap">
      <h1 data-testid="checkout-title">Disparar run</h1>
      <p class="lede">Exemplo: Mariana Alves agenda o pack de smoke no ambiente canary (sha de 7 chars).</p>
      <form class="stack" data-testid="checkout-form">
        <label>Dono do run <input name="name" required data-testid="checkout-name" placeholder="Mariana Alves" /></label>
        <label>E-mail <input name="email" type="email" required data-testid="checkout-email" placeholder="mariana.alves@example.com" /></label>
        <label>Ambiente <input name="cep" required data-testid="checkout-cep" placeholder="canary" /></label>
        <button type="submit">Confirmar run</button>
      </form>
      <p class="flash" hidden data-testid="checkout-result"></p>
      <p class="error" hidden data-testid="checkout-error"></p>
    </main>
    <footer class="site-footer">
      <p>Nimbus Gate · console de quality gate · Release 1.0</p>
    </footer>
    <script src="/app.js" defer></script>
  </body>
</html>
