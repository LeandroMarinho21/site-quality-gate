<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fila · Nimbus Gate</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="bar">
        <a class="brand" href="/" data-testid="brand">Nimbus <span>Gate</span></a>
        <form class="search" action="/catalog.html" data-testid="search-form">
          <input name="q" type="search" placeholder="Buscar suite: smoke, canary, error_rate" data-testid="search-input" />
          <button type="submit">Buscar</button>
        </form>
        <a class="bag" href="/cart.html" data-testid="nav-cart">Fila <span class="count" data-testid="cart-count">0</span></a>
      </div>
      <nav class="nav">
        <a href="/" data-testid="nav-home">Console</a>
        <a href="/catalog.html" data-testid="nav-catalog">Suites</a>
        <a href="/about.html" data-testid="nav-about">Sobre</a>
        <a href="/contact.html" data-testid="nav-contact">Flake</a>
        <a href="/status" data-testid="nav-status">Status</a>
      </nav>
    </header>
    <main class="wrap">
      <h1 data-testid="cart-title">Fila de execução</h1>
      <p class="empty" hidden data-testid="cart-empty">Fila vazia. Enfileire Smoke · home e health nas suites.</p>
      <table class="cart-table" data-testid="cart-table" hidden>
        <thead>
          <tr><th>Suite</th><th>Qtd</th><th>Duração</th><th></th></tr>
        </thead>
        <tbody data-testid="cart-body"></tbody>
      </table>
      <p>Estimativa: <strong data-testid="cart-total">0s</strong></p>
      <a class="btn" href="/checkout.html" data-testid="go-checkout">Disparar run</a>
    </main>
    <footer class="site-footer">
      <p>Nimbus Gate · console de quality gate · Release 1.0</p>
    </footer>
    <script src="/app.js" defer></script>
  </body>
</html>
