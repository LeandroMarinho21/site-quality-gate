<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sacola · Nimbus Shop</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="bar">
        <a class="brand" href="/" data-testid="brand">Nimbus Shop</a>
        <form class="search" action="/catalog.html" data-testid="search-form">
          <input name="q" type="search" placeholder="Buscar: lanterna, bota, mochila" data-testid="search-input" />
          <button type="submit">Buscar</button>
        </form>
        <a class="bag" href="/cart.html" data-testid="nav-cart">Sacola <span class="count" data-testid="cart-count">0</span></a>
      </div>
      <nav class="nav">
        <a href="/" data-testid="nav-home">Home</a>
        <a href="/catalog.html" data-testid="nav-catalog">Catálogo</a>
        <a href="/about.html" data-testid="nav-about">Sobre</a>
        <a href="/contact.html" data-testid="nav-contact">Contato</a>
        <a href="/status" data-testid="nav-status">Status</a>
      </nav>
    </header>
    <main class="wrap">
      <h1 data-testid="cart-title">Sacola</h1>
      <p class="empty" hidden data-testid="cart-empty">Sacola vazia. Comece pela Trail 32L no catálogo.</p>
      <table class="cart-table" data-testid="cart-table" hidden>
        <thead>
          <tr><th>Item</th><th>Qtd</th><th>Subtotal</th><th></th></tr>
        </thead>
        <tbody data-testid="cart-body"></tbody>
      </table>
      <p>Total: <strong data-testid="cart-total">R$ 0,00</strong></p>
      <a class="btn" href="/checkout.html" data-testid="go-checkout">Ir para o checkout</a>
    </main>
    <footer class="site-footer">
      <p>Nimbus Shop · loja de demonstração para quality gate · Release 1.0</p>
    </footer>
    <script src="/app.js" defer></script>
  </body>
</html>
