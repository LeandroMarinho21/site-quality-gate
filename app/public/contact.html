<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contato · Nimbus Shop</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="bar">
        <a class="brand" href="/" data-testid="brand">Nimbus Shop</a>
        <form class="search" action="/catalog.html" data-testid="search-form">
          <input name="q" type="search" placeholder="Buscar lanterna, bota, mochila…" data-testid="search-input" />
          <button type="submit">Buscar</button>
        </form>
        <a class="bag" href="/cart.html" data-testid="nav-cart">Sacola <span class="count" data-testid="cart-count">0</span></a>
      </div>
      <nav class="nav">
        <a href="/" data-testid="nav-home">Home</a>
        <a href="/catalog.html" data-testid="nav-catalog">Catálogo</a>
        <a href="/about.html" data-testid="nav-about">Sobre</a>
        <a href="/contact.html" data-testid="nav-contact" aria-current="page">Contato</a>
        <a href="/status" data-testid="nav-status">Status</a>
      </nav>
    </header>
    <main class="wrap">
      <p class="eyebrow">Suporte</p>
      <h1 data-testid="contact-title">Fale com o suporte</h1>
      <p class="lede">Troca da Granite Mid, prazo da Storm, retirada em São Paulo.</p>
      <form class="stack" data-testid="contact-form">
        <label>Nome <input name="name" required data-testid="contact-name" placeholder="João Ribeiro" /></label>
        <label>Mensagem <textarea name="message" required data-testid="contact-message" placeholder="A Granite Mid serve no 42?"></textarea></label>
        <button type="submit">Enviar</button>
      </form>
      <p class="flash" hidden data-testid="contact-result"></p>
    </main>
    <footer class="site-footer">
      <p>Nimbus Shop · Serra do Mar · Release 1.0</p>
    </footer>
    <script src="/app.js" defer></script>
  </body>
</html>
